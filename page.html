<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniPatcher</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Segoe UI", "Yu Gothic UI", sans-serif; margin: 0; background: #eef1f4; color: #222; }
  header { background: #2b579a; color: #fff; padding: 10px 16px; font-size: 18px; font-weight: 600; }
  header .build { font-size: 11px; font-weight: 400; opacity: .75; margin-left: 8px; }
  nav#tabs { display: flex; gap: 4px; padding: 8px 12px 0; }
  nav#tabs button { flex: 1; padding: 9px 4px; font-size: 14px; border: 1px solid #b9c2cc; border-bottom: none; background: #d7dde4; border-radius: 6px 6px 0 0; cursor: pointer; }
  nav#tabs button.active { background: #fff; font-weight: 600; }
  .page { background: #fff; margin: 0 12px 12px; padding: 14px 16px 18px; border: 1px solid #b9c2cc; border-radius: 0 0 6px 6px; }
  .desc { white-space: pre-line; font-size: 13px; color: #444; background: #f4f7fa; border: 1px solid #dde4ea; border-radius: 6px; padding: 8px 10px; margin: 0 0 10px; line-height: 1.55; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .filefield { display: flex; align-items: center; gap: 8px; border: 1.5px dashed #9db1c4; border-radius: 6px; padding: 8px; background: #fbfdfe; cursor: pointer; }
  .filefield.drag { border-color: #2b579a; background: #e3ecf7; }
  .filefield .fname { font-size: 13px; word-break: break-all; }
  .filefield .hint { font-size: 11px; color: #77828d; }
  .openbtn { background: #2b579a; color: #fff; border: none; border-radius: 4px; padding: 6px 14px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .meta { font-size: 12.5px; color: #333; margin-top: 4px; font-family: Consolas, monospace; white-space: pre-line; }
  .meta .ok { color: #1a7d1a; font-weight: 700; }
  .meta .ng { color: #c00; font-weight: 700; }
  input[type="text"], select { width: 100%; padding: 7px 8px; font-size: 14px; border: 1px solid #b9c2cc; border-radius: 4px; }
  .bigbtn { width: 100%; padding: 12px; font-size: 16px; font-weight: 600; background: #2b579a; color: #fff; border: none; border-radius: 6px; cursor: pointer; margin-top: 4px; }
  .bigbtn:disabled { background: #9db1c4; }
  .setrow { margin-bottom: 16px; font-size: 14px; }
  .setrow label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 13px; }
  .setrow .opt { display: block; font-weight: 400; margin: 3px 0; }
  #dialog { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 50; }
  #dialog-card { background: #fff; border-radius: 8px; padding: 18px; width: min(92vw, 460px); box-shadow: 0 6px 30px rgba(0,0,0,.3); }
  #dialog-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
  #dialog-msg { font-size: 13.5px; white-space: pre-line; line-height: 1.55; margin-bottom: 14px; word-break: break-all; }
  #dialog-btns { display: flex; gap: 8px; justify-content: flex-end; }
  #dialog-btns button { padding: 8px 18px; font-size: 14px; border-radius: 5px; border: 1px solid #b9c2cc; background: #f0f3f6; cursor: pointer; }
  #dialog-btns button.primary { background: #2b579a; color: #fff; border-color: #2b579a; }
</style>
</head>
<body>
<header><span data-i18n="appTitle"></span><span class="build">build __BUILD__</span></header>
<nav id="tabs">
  <button type="button" class="tab active" id="tabbtn-apply" onclick="showPage('apply')" data-i18n="tabApply"></button>
  <button type="button" class="tab" id="tabbtn-create" onclick="showPage('create')" data-i18n="tabCreate"></button>
  <button type="button" class="tab" id="tabbtn-settings" onclick="showPage('settings')" data-i18n="tabSettings"></button>
</nav>

<div class="page" id="page-apply">
  <p class="desc" data-i18n="descApply"></p>
  <p class="desc" data-i18n="formatsApply"></p>
  <p class="desc" data-i18n="crcInfo"></p>
  <div class="field">
    <label data-i18n="romFile"></label>
    <div class="filefield" id="ff-apply-rom">
      <input type="file" id="fi-apply-rom" hidden>
      <button type="button" class="openbtn" data-i18n="openBtn"></button>
      <span class="fname" id="fn-apply-rom"></span>
      <span class="hint" data-i18n="dropHint"></span>
    </div>
    <div class="meta" id="meta-apply-rom"></div>
  </div>
  <div class="field">
    <label data-i18n="patchFile"></label>
    <div class="filefield" id="ff-apply-patch">
      <input type="file" id="fi-apply-patch" hidden>
      <button type="button" class="openbtn" data-i18n="openBtn"></button>
      <span class="fname" id="fn-apply-patch"></span>
      <span class="hint" data-i18n="dropHint"></span>
    </div>
    <div class="meta" id="meta-apply-patch"></div>
  </div>
  <div class="field">
    <label data-i18n="outputName"></label>
    <input type="text" id="apply-outname">
  </div>
  <button type="button" class="bigbtn" id="apply-btn" onclick="doApply(false)" data-i18n="applyBtn"></button>
</div>

<div class="page" id="page-create" style="display:none">
  <p class="desc" data-i18n="descCreate"></p>
  <p class="desc" data-i18n="formatsCreate"></p>
  <div class="field">
    <label data-i18n="origFile"></label>
    <div class="filefield" id="ff-create-orig">
      <input type="file" id="fi-create-orig" hidden>
      <button type="button" class="openbtn" data-i18n="openBtn"></button>
      <span class="fname" id="fn-create-orig"></span>
      <span class="hint" data-i18n="dropHint"></span>
    </div>
    <div class="meta" id="meta-create-orig"></div>
  </div>
  <div class="field">
    <label data-i18n="modFile"></label>
    <div class="filefield" id="ff-create-mod">
      <input type="file" id="fi-create-mod" hidden>
      <button type="button" class="openbtn" data-i18n="openBtn"></button>
      <span class="fname" id="fn-create-mod"></span>
      <span class="hint" data-i18n="dropHint"></span>
    </div>
    <div class="meta" id="meta-create-mod"></div>
  </div>
  <div class="field">
    <label data-i18n="formatLabel"></label>
    <select id="create-format">
      <option value="bps">BPS</option>
      <option value="ips">IPS</option>
      <option value="ups">UPS</option>
      <option value="xdelta">xdelta (VCDIFF)</option>
    </select>
  </div>
  <div class="field">
    <label data-i18n="patchNameLabel"></label>
    <input type="text" id="create-outname">
  </div>
  <button type="button" class="bigbtn" id="create-btn" onclick="doCreate()" data-i18n="createBtn"></button>
</div>

<div class="page" id="page-settings" style="display:none">
  <p class="desc" data-i18n="descSettings"></p>
  <div class="setrow">
    <label data-i18n="langLabel"></label>
    <select id="set-lang">
      <option value="auto" data-i18n="langAuto"></option>
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="it">Italiano</option>
      <option value="es">Español</option>
      <option value="ru">Русский</option>
      <option value="pt">Português</option>
      <option value="pl">Polski</option>
      <option value="ko">한국어</option>
      <option value="zh-Hans">简体中文</option>
      <option value="zh-Hant">繁體中文</option>
    </select>
  </div>
  <div class="setrow">
    <label data-i18n="crcModeLabel"></label>
    <label class="opt"><input type="radio" name="crcmode" value="warn"> <span data-i18n="crcWarn"></span></label>
    <label class="opt"><input type="radio" name="crcmode" value="block"> <span data-i18n="crcBlock"></span></label>
    <label class="opt"><input type="radio" name="crcmode" value="ignore"> <span data-i18n="crcIgnore"></span></label>
  </div>
  <div class="setrow">
    <label class="opt"><input type="checkbox" id="set-md5"> <span data-i18n="showMD5Label"></span></label>
    <label class="opt"><input type="checkbox" id="set-sha1"> <span data-i18n="showSHA1Label"></span></label>
  </div>
  <p class="desc" data-i18n="settingsNote"></p>
</div>

<div id="dialog">
  <div id="dialog-card">
    <div id="dialog-title"></div>
    <div id="dialog-msg"></div>
    <div id="dialog-btns"></div>
  </div>
</div>

// ---- 設定 ----
const SETTINGS_KEY = "unipatcher_settings";
let settings = { lang: "auto", crcMode: "warn", showMD5: false, showSHA1: false };
try {
  const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "null");
  if (saved) settings = Object.assign(settings, saved);
} catch (e) {}
function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {} }

const LANGS = ["ja","en","fr","de","it","es","ru","pt","pl","ko","zh-Hans","zh-Hant"];
function systemLang() {
  const nav = (navigator.language || "en").toLowerCase();
  if (nav.startsWith("zh")) {
    return (nav.includes("tw") || nav.includes("hk") || nav.includes("hant")) ? "zh-Hant" : "zh-Hans";
  }
  const base = nav.split("-")[0];
  return LANGS.includes(base) ? base : "en";
}
let LANG = settings.lang === "auto" ? systemLang() : (LANGS.includes(settings.lang) ? settings.lang : "en");
function t(k) { return (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k; }

// ---- 状態 ----
const state = {
  files: {},   // フィールド id -> File
  hashes: {},  // フィールド id -> /api/hash の結果
  patchInfo: null, // 適用ページのパッチ情報
  romCRC: null     // 適用ページのロム CRC32 (文字列)
};
const FIELD_KIND = { "apply-rom": "rom", "apply-patch": "patch", "create-orig": "rom", "create-mod": "rom" };

function showPage(name) {
  for (const n of ["apply", "create", "settings"]) {
    document.getElementById("page-" + n).style.display = n === name ? "" : "none";
    document.getElementById("tabbtn-" + n).classList.toggle("active", n === name);
  }
}

function fmtSize(n) { return n.toLocaleString("en-US") + " bytes"; }

function renderRomMeta(id) {
  const h = state.hashes[id];
  const el = document.getElementById("meta-" + id);
  if (!h) { el.textContent = ""; return; }
  let s = t("crcLabel") + ": " + h.crc32 + "  ·  " + t("sizeLabel") + ": " + fmtSize(h.size);
  if (settings.showMD5) s += "\nMD5: " + h.md5;
  if (settings.showSHA1) s += "\nSHA-1: " + h.sha1;
  el.textContent = s;
}

function renderPatchMeta() {
  const el = document.getElementById("meta-apply-patch");
  const info = state.patchInfo;
  if (!info) { el.textContent = ""; return; }
  let s = t("formatDetectedLabel") + ": " + info.formatName + "  ·  " + t("sizeLabel") + ": " + fmtSize(info.size);
  if (info.hasSourceCRC) {
    s += "\n" + t("expectedCRCLabel") + ": " + info.sourceCRC;
    if (info.hasTargetCRC) s += "\n" + t("targetCRCLabel") + ": " + info.targetCRC;
  } else {
    s += "\n" + t("noCRCText");
  }
  el.textContent = s;
  // 照合マークは専用 span で色付き表示する
  let ind = document.getElementById("match-ind");
  if (info.hasSourceCRC && state.romCRC) {
    if (!ind) {
      ind = document.createElement("span");
      ind.id = "match-ind";
      el.appendChild(document.createTextNode("\n"));
      el.appendChild(ind);
    }
    const ok = info.sourceCRC === state.romCRC;
    ind.textContent = ok ? t("matchOK") : t("matchNG");
    ind.className = ok ? "ok" : "ng";
  } else if (ind) {
    ind.remove();
  }
}

async function setFile(id, file) {
  if (!file) return;
  state.files[id] = file;
  document.getElementById("fn-" + id).textContent = file.name;
  const kind = FIELD_KIND[id];
  try {
    const fd = new FormData();
    fd.append("file", file);
    if (kind === "patch") {
      const res = await fetch("/api/patchinfo", { method: "POST", body: fd });
      const j = await res.json();
      if (!res.ok) { showDialog(t("dlgError"), j.error || "error"); state.patchInfo = null; }
      else state.patchInfo = j;
      renderPatchMeta();
    } else {
      const res = await fetch("/api/hash", { method: "POST", body: fd });
      const j = await res.json();
      if (!res.ok) { showDialog(t("dlgError"), j.error || "error"); return; }
      state.hashes[id] = j;
      if (id === "apply-rom") {
        state.romCRC = j.crc32;
        renderPatchMeta();
        // 手入力されていなければ、新しいロムから出力名を作り直す
        // (古い自動入力が残って別ファイルの名前になる事故を防ぐ)
        if (!applyOutManual) {
          document.getElementById("apply-outname").value = defaultOutName(file.name);
        }
      }
      if (id === "create-mod" && !createOutManual) {
        document.getElementById("create-outname").value =
          defaultPatchName(file.name, document.getElementById("create-format").value);
      }
      renderRomMeta(id);
    }
  } catch (e) {
    // 通信できない環境 (jsdom 検証など) では名前表示だけ行う
  }
}

function splitExt(name) {
  const dot = name.lastIndexOf(".");
  if (dot > 0) return [name.slice(0, dot), name.slice(dot)];
  return [name, ""];
}
function defaultOutName(name) {
  const [base, ext] = splitExt(name);
  return base + " (patched)" + ext;
}
const PATCH_FORMAT_EXT = { ips: ".ips", ups: ".ups", bps: ".bps", xdelta: ".xdelta" };
const PATCH_EXTS = [".ips", ".ips32", ".ups", ".bps", ".aps", ".ppf", ".xdelta", ".vcdiff", ".dps", ".ebp"];
function defaultPatchName(name, format) {
  const [base] = splitExt(name);
  return base + (PATCH_FORMAT_EXT[format] || ".bps");
}
// 適用結果の拡張子は必ず元のロムの拡張子にそろえる。
// 出力名欄にパッチ形式の拡張子 (.bps 等) が入っていても、保存時に
// ロムの形式で保存されるようにするための最終ガード。
function enforceRomExt(outName, romName) {
  const [, romExt] = splitExt(romName);
  const [base, outExt] = splitExt(outName);
  if (romExt) {
    return outExt.toLowerCase() === romExt.toLowerCase() ? outName : base + romExt;
  }
  // ロムに拡張子が無い場合は、パッチ形式の拡張子だけを取り除く
  return PATCH_EXTS.includes(outExt.toLowerCase()) ? base : outName;
}
// 作成するパッチの拡張子は、選択中の形式にそろえる (最終ガード)。
function enforcePatchExt(outName, format) {
  const want = PATCH_FORMAT_EXT[format] || ".bps";
  const [base, outExt] = splitExt(outName);
  return outExt.toLowerCase() === want ? outName : base + want;
}
// 出力名欄が手入力されたかどうか (自動入力の上書き可否の判定に使う)
let applyOutManual = false;
let createOutManual = false;
function initOutNames() {
  document.getElementById("apply-outname").addEventListener("input", () => { applyOutManual = true; });
  document.getElementById("create-outname").addEventListener("input", () => { createOutManual = true; });
}

// ファイル欄: クリックで開く + ドラッグ&ドロップ
function initFileFields() {
  for (const id of Object.keys(FIELD_KIND)) {
    const ff = document.getElementById("ff-" + id);
    const fi = document.getElementById("fi-" + id);
    document.getElementById("fn-" + id).textContent = t("noFile");
    ff.addEventListener("click", () => fi.click());
    fi.addEventListener("change", () => { if (fi.files && fi.files[0]) setFile(id, fi.files[0]); });
    ff.addEventListener("dragover", (e) => { e.preventDefault(); ff.classList.add("drag"); });
    ff.addEventListener("dragleave", () => ff.classList.remove("drag"));
    ff.addEventListener("drop", (e) => {
      e.preventDefault();
      ff.classList.remove("drag");
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) setFile(id, e.dataTransfer.files[0]);
    });
  }
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("drop", (e) => e.preventDefault());
}

function showConfirmDialog(msg, onContinue) {
  document.getElementById("dialog-title").textContent = t("dlgConfirm");

  btns.innerHTML = "";

  btns.appendChild(cancel);
  btns.appendChild(cont);

}
function hideDialog() { document.getElementById("dialog").style.display = "none"; }

function downloadBlob(blob, name) {
  // Android shell: blob downloads do nothing in a WebView, so hand the
  // bytes to the named UniBridge, which saves into Downloads. Guarded:
  // on Windows / desktop browsers the bridge does not exist and the
  // normal anchor download below runs unchanged.
  if (window.UniBridge && typeof window.UniBridge.beginSave === "function") {
    return saveViaBridge(blob, name);
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return Promise.resolve(true);
}

async function saveViaBridge(blob, name) {
  try {
    if (!window.UniBridge.beginSave(name)) return false;
    const buf = new Uint8Array(await blob.arrayBuffer());
    const CHUNK = 3 * 65536; // multiple of 3: clean base64 per chunk
    for (let off = 0; off < buf.length; off += CHUNK) {
      const part = buf.subarray(off, Math.min(off + CHUNK, buf.length));
      let bin = "";
      for (let i = 0; i < part.length; i += 32768) {
        bin += String.fromCharCode.apply(null, part.subarray(i, i + 32768));
      }
      if (!window.UniBridge.appendSave(btoa(bin))) return false;
    }
    return !!window.UniBridge.finishSave();
  } catch (e) {
    return false;
  }
}

// ---- 適用 ----
async function doApply(force) {
  const rom = state.files["apply-rom"];
  const patch = state.files["apply-patch"];
  if (!rom) { showDialog(t("dlgError"), t("errRom")); return; }
  if (!patch) { showDialog(t("dlgError"), t("errPatch")); return; }
  const outField = document.getElementById("apply-outname");
  const outName = enforceRomExt(outField.value.trim() || defaultOutName(rom.name), rom.name);
  outField.value = outName; // そろえた名前を欄にも反映する
  const btn = document.getElementById("apply-btn");
  btn.disabled = true;
  btn.textContent = t("working");
  try {
    const fd = new FormData();
    fd.append("rom", rom);
    fd.append("patch", patch);
    fd.append("crcMode", settings.crcMode);
    fd.append("force", force ? "1" : "0");
    const res = await fetch("/api/apply", { method: "POST", body: fd });
    if (res.status === 409) {
      const j = await res.json();
      showConfirmDialog(
        t("crcMismatchMsg") + "\n" + t("expectedCRCLabel") + ": " + j.expectedCRC + "\n" + t("crcLabel") + ": " + j.actualCRC,
        () => doApply(true)
      );
      return;
    }
    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      showDialog(t("dlgError"), j.error || ("HTTP " + res.status));
      return;
    }
    const crc = res.headers.get("X-Output-CRC32") || "";
    const size = res.headers.get("X-Output-Size") || "";
    const blob = await res.blob();
    if (!(await downloadBlob(blob, outName))) {
      showDialog(t("dlgError"), t("errSave"));
      return;
    }
    showDialog(t("dlgSuccess"), t("doneMsgApply") + "\n" + outName + "\n" + t("crcLabel") + ": " + crc + "  ·  " + t("sizeLabel") + ": " + fmtSize(Number(size)));
  } catch (e) {
    showDialog(t("dlgError"), String(e));
  } finally {
    btn.disabled = false;
    btn.textContent = t("applyBtn");
  }
}

// ---- 作成 ----
async function doCreate() {
  const orig = state.files["create-orig"];
  const mod = state.files["create-mod"];
  if (!orig) { showDialog(t("dlgError"), t("errOrig")); return; }
  if (!mod) { showDialog(t("dlgError"), t("errMod")); return; }
  const format = document.getElementById("create-format").value;
  const outField = document.getElementById("create-outname");
  const outName = enforcePatchExt(outField.value.trim() || defaultPatchName(mod.name, format), format);
  outField.value = outName; // そろえた名前を欄にも反映する
  const btn = document.getElementById("create-btn");
  btn.disabled = true;
  btn.textContent = t("working");
  try {
    const fd = new FormData();
    fd.append("original", orig);
    fd.append("modified", mod);
    fd.append("format", format);
    const res = await fetch("/api/create", { method: "POST", body: fd });
    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      showDialog(t("dlgError"), j.error || ("HTTP " + res.status));
      return;
    }
    const crc = res.headers.get("X-Output-CRC32") || "";
    const size = res.headers.get("X-Output-Size") || "";
    const blob = await res.blob();
    if (!(await downloadBlob(blob, outName))) {
      showDialog(t("dlgError"), t("errSave"));
      return;
    }
    showDialog(t("dlgSuccess"), t("doneMsgCreate") + "\n" + outName + "\n" + t("crcLabel") + ": " + crc + "  ·  " + t("sizeLabel") + ": " + fmtSize(Number(size)));
  } catch (e) {
    showDialog(t("dlgError"), String(e));
  } finally {
    btn.disabled = false;
    btn.textContent = t("createBtn");
  }
}

// ---- 言語と設定の反映 ----
// Android シェル内ではドラッグ&ドロップが無いので、ヒント文言を
// タップ用に差し替える (Windows / デスクトップでは従来表示のまま)。
// 判定は保存経路と同じ UniBridge の存在チェックを使う。
const IS_ANDROID = !!(window.UniBridge && typeof window.UniBridge.beginSave === "function");
function applyLang() {
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const k = el.getAttribute("data-i18n");
    el.textContent = (IS_ANDROID && k === "dropHint") ? t("tapHint") : t(k);
  });
  for (const id of Object.keys(FIELD_KIND)) {
    const fn = document.getElementById("fn-" + id);
    if (!state.files[id]) fn.textContent = t("noFile");
    if (FIELD_KIND[id] === "rom") renderRomMeta(id);
  }
  renderPatchMeta();
  document.getElementById("apply-btn").textContent = t("applyBtn");
  document.getElementById("create-btn").textContent = t("createBtn");
}
function initSettings() {
  const sel = document.getElementById("set-lang");
  sel.value = settings.lang;
  sel.addEventListener("change", () => {
    settings.lang = sel.value;
    LANG = settings.lang === "auto" ? systemLang() : settings.lang;
    saveSettings();
    applyLang();
  });
  document.querySelectorAll("input[name='crcmode']").forEach((r) => {
    r.checked = r.value === settings.crcMode;
    r.addEventListener("change", () => { settings.crcMode = r.value; saveSettings(); });
  });
  const md5 = document.getElementById("set-md5");
  md5.checked = settings.showMD5;
  md5.addEventListener("change", () => { settings.showMD5 = md5.checked; saveSettings(); applyLang(); });
  const sha1 = document.getElementById("set-sha1");
  sha1.checked = settings.showSHA1;
  sha1.addEventListener("change", () => { settings.showSHA1 = sha1.checked; saveSettings(); applyLang(); });
  document.getElementById("create-format").addEventListener("change", (e) => {
    const mod = state.files["create-mod"];
    const out = document.getElementById("create-outname");
    if (mod && !createOutManual) out.value = defaultPatchName(mod.name, e.target.value);
  });
}

initFileFields();
initOutNames();
initSettings();
applyLang();
showPage("apply");
</script>
</body>
</html>
